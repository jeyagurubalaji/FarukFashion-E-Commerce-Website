server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 50
      min-spare: 2

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:my_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:my_google_client_secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  application:
    name: faruk-fashion
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/faruk_fashion}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:my_email@gmail.com}
    password: ${MAIL_PASSWORD:my_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:my_jwt_secret_key_must_be_at_least_64_bytes}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_my_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:my_razorpay_secret}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:my_twilio_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:my_twilio_auth_token}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:+14155238886}
  sms-from: ${TWILIO_SMS_FROM:+14155238886}

app:
  name: Faruk Fashion
  support-email: ${SUPPORT_EMAIL:jgbalajinfinity006@gmail.com}
  support-phone: ${SUPPORT_PHONE:+91 6369456650}
  admin-phone: ${ADMIN_PHONE:+91 6369456650}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  seller-email: ${SELLER_EMAIL:jgbalajinfinity006@gmail.com}
  upload-dir: ${UPLOAD_DIR:uploads}
  notifications:
    email-enabled: true
    sms-enabled: false
    whatsapp-enabled: false

logging:
  level:
    root: WARN
    com.farukfashion: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics